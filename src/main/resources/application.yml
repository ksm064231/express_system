server:
  port: 8080

spring:
  application:
    name: express-delivery-system

  datasource:
    url: jdbc:mysql://localhost:3306/express_delivery?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # 邮件配置（用于发送取件码通知）
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-authorization-code
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT 配置
jwt:
  secret: ExpressDeliverySystem2024SecretKeyForJWTTokenGenerationMustBe256BitsLong
  expiration: 86400000  # 24小时，单位毫秒

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
